[project]
name = "rede-social-trilha"
version = "0.1.0"
description = "Mini-projeto 3 da Trilha — rede social de nicho (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "bcrypt==4.2.1",
    "faker>=25.0",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
